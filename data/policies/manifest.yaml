# 정책 문서 수집 목록 (RAG 원천)
#
# rag/ingest.py 가 이 파일을 읽어 문서를 받아오고, 번역한 뒤 ai.rag_documents 에 적재한다.
# 필드 이름은 infra/models.py 의 RagDocument 컬럼과 1:1 로 맞춘다.
#
#   country         ISO-2 국가 코드
#   document_type   PROHIBITED_LIST | CUSTOMS | TAX | CERTIFICATION | PLATFORM_POLICY | RETURN_POLICY
#   category_code   특정 카테고리 전용 문서면 표기, 전 품목 공통이면 생략
#   source_url      원문 주소. 캡처본이 아니라 갱신되는 원문을 가리킨다
#   publisher       발행 기관
#   effective_from  시행일 (YYYY-MM-DD). 판정 근거 표시에 그대로 쓴다
#   language        원문 언어
#   review_status   DRAFT | VERIFIED. 번역 검토를 마친 것만 VERIFIED 로 올린다.
#                   CUSTOMS_GATE 의 최종 판매 가능 판정은 VERIFIED 문서만 본다.
#   supersedes      이 문서가 대체한 이전 문서의 doc_id
#
# 담당: 차은호. 1주차 VN 10건 → 3주차 VN 20~40건 + SG/TH 각 5~10건.


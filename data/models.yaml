# 이미지 AI 생성 — 기본 모델 4종과 컷 스타일 (화면 DTL-01-02)
#
# 모델 id·이름·설명은 프론트 mocks/detailImage.ts 의 baseModelsMock 과 같아야 한다.
# persona 는 gpt-image-1 프롬프트 앞에 붙는 영어 문장이다. 실존 인물을 지칭하지 않는다.
# 프롬프트를 고치면 version 을 올린다 (결과 캐시 키에 들어간다).
#
# 담당: 강근우 (콘텐츠 아키텍트 R-003)

version: image-models.v1

models:
  model-1:
    name: 기본 모델 1
    desc: 20대 여성 · 동아시아
    persona: >-
      A fictional East Asian woman in her twenties with a natural, friendly look,
      light everyday makeup and casual modern clothing.
  model-2:
    name: 기본 모델 2
    desc: 30대 남성 · 동아시아
    persona: >-
      A fictional East Asian man in his thirties with a clean, approachable look
      and smart casual clothing.
  model-3:
    name: 기본 모델 3
    desc: 20대 여성 · 동남아시아
    persona: >-
      A fictional Southeast Asian woman in her twenties with a warm, cheerful look
      and bright casual clothing.
  model-4:
    name: 기본 모델 4
    desc: 30대 남성 · 동남아시아
    persona: >-
      A fictional Southeast Asian man in his thirties with a relaxed, friendly look
      and simple casual clothing.

# 대상(target) 별 스타일. PRODUCT = 상품 썸네일, DETAIL = 상세페이지 본문 컷
targets:
  PRODUCT: >-
    Square e-commerce product photo for a Shopee listing thumbnail.
    Product centered and fully visible, soft studio lighting, uncluttered background.
  DETAIL: >-
    Product detail page image for a Shopee listing. Editorial composition that
    shows the product clearly, with calm negative space around it.

# 생성 방식(mode) 별 지시
modes:
  BASIC: Show only the product, with no people and no hands.
  MODEL: >-
    The model naturally holds or uses the product. The product stays the visual focus
    and is not covered by hands or clothing.

# 항상 붙는 지시. 상품 형태 왜곡·타사 로고·글자 생성을 막는다.
guardrails: >-
  Keep the product's shape, colours, proportions and printed details exactly as in the
  reference images. Do not add any text, watermark, price tag or other brand logos
  unless the request explicitly asks for it. Photorealistic.

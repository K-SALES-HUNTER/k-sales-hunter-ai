# 3개국 공통 문화·표현 필터 사전 (한국어 초안 검수용)
#
# banned       하드 컷. 사람 승인 전 통과 불가. 의약품 오인·위조품·허위 인증 표현
# trademark    하드 컷. 타사 상표·캐릭터. 셀러가 라이선스를 가진 경우 사람이 승인한다
# exaggeration 소프트. 감점만. replace 가 있으면 코드가 바로 바꾼다
#
# 매칭 규칙: 영문은 단어 경계·대소문자 무시, 그 외는 부분 문자열.
# 짧은 단어는 오탐이 많다 (예: "약" 은 "약산성" 에 걸린다). 두 글자 이상 구절로 적는다.
#
# 근거: 화장품법 제13조(의약품 오인 표시 금지), 표시광고법 제3조(부당 광고), 상표법.
# 담당: 강근우 (콘텐츠 아키텍트 R-003)

version: common-culture-2026.10

banned:
  - { term: 치료, reason: 의약품 오인 표현 }

# 태국 문화·표현 필터 (현지어 th + 국가 특수 금기)
# common.yaml 과 합쳐서 쓴다. 형식은 common.yaml 참조.
#
# 근거: 형법 제112조(왕실 모독), 불상 반출·상업 이용 관련 문화부 지침,
#       화장품법 B.E.2558 (치료 효능 광고 금지).
# 태국어는 띄어쓰기가 없어 짧은 단어는 오탐이 심하다. 세 글자 이상 구절만 적는다.
# 담당: 강근우

version: th-culture-2026.10
locale: th

banned:
  - { term: รักษาโรค, reason: 의약품 오인 표현 }
  - { term: หายขาด, reason: 의약품 오인 표현 }
  - { term: ของปลอม, reason: 위조품 연상 }
  - { term: ก๊อปเกรด, reason: 위조품 연상 }
  # 왕실 언급은 상업 문구에서 전부 뺀다
  - { term: 왕실, reason: 왕실 언급 금지 (형법 112조 리스크) }
  - { term: 국왕, reason: 왕실 언급 금지 (형법 112조 리스크) }
  - { term: ราชวงศ์, reason: 왕실 언급 금지 (형법 112조 리스크) }
  - { term: พระมหากษัตริย์, reason: 왕실 언급 금지 (형법 112조 리스크) }
  # 불상·부처 이미지의 장식·상업 이용은 금기
  - { term: 불상, reason: 불교 상징 상업 이용 금기 }
  - { term: Buddha, reason: 불교 상징 상업 이용 금기 }
  - { term: พระพุทธรูป, reason: 불교 상징 상업 이용 금기 }

trademark: []

exaggeration:
  - { term: ดีที่สุด, reason: 최상급 표현 }
  - { term: อันดับ 1, reason: 최상급 표현 }
  - { term: เห็นผล 100%, reason: 효능 단정 표현 }

guidelines:
  - 태국어는 정중한 어미(ค่ะ/ครับ)를 남발하지 말고 상품 설명체로 쓴다.
  - 가격은 ฿ 기호와 소수 둘째 자리까지 쓴다. 예) ฿350.00
  - 왕실·불교 상징을 연상시키는 비유를 쓰지 않는다.
  - 발을 가리키거나 머리를 만지는 동작 묘사는 피한다.

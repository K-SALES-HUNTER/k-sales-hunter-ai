[project]
name = "sales-hunter-ai"
version = "0.1.0"
description = "K-Sales Hunter AI service (LangGraph multi-agent)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # LangGraph / LLM
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # infra
    "redis>=5.2",
    "structlog>=24.4",
    # external data
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]   # FastAPI Depends 패턴

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: 실제 LLM/외부 API를 호출한다. CI에서 제외. 주 1회 수동 실행.",
]
